[package]
name = "brink"
version = "0.1.0"
edition = "2021"
description = "Defense-in-depth Linux process sandbox: cgroup v2, namespaces, Landlock LSM, seccomp-BPF"
license = "MIT"
readme = "README.md"

[lib]
name = "brink"

[dependencies]
libc    = "0.2"
nix     = { version = "0.29", features = [
    "event",    # eventfd
    "fs",       # open, stat, etc.
    "hostname", # sethostname in UTS namespace
    "ioctl",    # TIOCSWINSZ, tty ops
    "mman",     # mlock family
    "mount",    # mount(2), umount2(2)
    "process",  # fork, exec, waitid
    "resource", # setrlimit
    "sched",    # close_range
    "signal",   # signal handling
    "socket",   # sendmsg/recvmsg + SCM_RIGHTS
    "term",     # termios, winsize
    "uio",      # IoSlice / IoSliceMut for sendmsg
    "user",     # uid_t, gid_t
] }
libseccomp = "0.3"
landlock   = "0.4"
tokio      = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
